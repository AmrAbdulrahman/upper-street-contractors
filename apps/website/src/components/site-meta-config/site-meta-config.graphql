fragment SiteMetaConfig on SiteMetaConfig {
  id
  siteName
  tagline
  logoDark {
    url
  }
  logoLight {
    url
  }
  favicon {
    url
  }
  siteUrl
  pageTitleTemplate
  defaultMetaTitle
  defaultMetaDescription
  indexable
  legalName
  phoneNumber
  email
  addressLine
  city
  postalCode
  mapLocation
  defaultImage {
    url
    alt
    width
    height
  }
  socialLinks {
    id
    socialNetworkName
    url
  }
  # Spread, not a hand-written selection: the footer row renders the same
  # <Accreditation> component the home strip does, so it must select exactly
  # what that component's fragment declares.
  footerAccreditations {
    ...Accreditation
  }
  footerLogoSize
  footerGlowColor
  footerGlowRadius
  footerGlowIntensity
  # The Theme tab. Every one optional: an unset token emits nothing and the
  # built-in in globals.css stands, which is what makes "Reset theme" a matter
  # of clearing fields rather than storing a second copy of the defaults.
  themeSurface
  themeWhite
  themeDark
  themeDark2
  themeGold
  themeGoldLight
  themeGoldMid
  themeGoldDeep
  themeForeground
  themeMuted
  themeSubtle
  themeBorder
  themeBorderLight
  themeWhatsapp
}

query GetSiteMetaConfig($status: CmsReadStatus = published, $includeUnpublished: Boolean) {
  siteMetaConfigs(pagination: { limit: 1 }, status: $status, includeUnpublished: $includeUnpublished) {
    ...SiteMetaConfig
  }
}
