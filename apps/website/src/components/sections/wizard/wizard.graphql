fragment WizardSection on Wizard {
  id
  type
  submitLabel
  whatsappNumber
  doneTitle
  doneMessage
  contactDetails {
    ...ContactDetailsSection
  }
  questions {
    __typename
    ... on ImageQuestion {
      ...ImageQuestion
    }
    ... on FormQuestion {
      ...FormQuestion
    }
  }
}

# A Branch rule's `appliesTo` points at image-options, which are themselves
# image-options — selecting the whole fragment would recurse forever. Only the
# id is needed: the wizard matches it against what the visitor has selected.
# The Step introduction, held as its own entry so it can be edited on its own
# and reused across steps.
fragment RichTextBlock on RichTextBlock {
  id
  body
}

fragment StepCopy on StepCopy {
  id
  title
  intro {
    ...RichTextBlock
  }
  whenEmergency
  appliesTo {
    id
  }
}

fragment ImageQuestion on ImageQuestion {
  id
  stepLabel
  title
  hint
  intro {
    ...RichTextBlock
  }
  multiSelect
  gatedBy {
    id
  }
  variants {
    ...StepCopy
  }
  options {
    ...ImageOption
  }
}

fragment ImageOption on ImageOption {
  id
  emoji
  label
  description
  revealTextInput
  textInputPlaceholder
  whenEmergency
  appliesTo {
    id
  }
  image {
    url
    alt
    width
    height
  }
}

fragment FormQuestion on FormQuestion {
  id
  stepLabel
  title
  hint
  intro {
    ...RichTextBlock
  }
  variants {
    ...StepCopy
  }
  fields {
    ...FormField
  }
}

fragment FormField on FormField {
  id
  label
  fieldKey
  inputType
  placeholder
  required
  dependsOnFieldKey
  dependsOnValue
  maxDates
  earliestOffsetDays
  horizonMonths
  allowWeekends
  whenEmergency
  isEmergencyFlag
  emergencyHorizonDays
  appliesTo {
    id
  }
}
