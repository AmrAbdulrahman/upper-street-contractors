# Card-shaped selection: everything the /blog index needs and nothing more.
# Sections are deliberately absent — the index renders 20+ cards and a post's
# sections are only read on its own page.
fragment BlogPostCard on BlogPost {
  id
  type
  slug
  title
  excerpt
  category
  publishedAt
  hero {
    url
    alt
    width
    height
  }
}

query GetBlogPosts($status: CmsReadStatus = published, $includeUnpublished: Boolean) {
  blogPosts(
    sort: [{ field: "publishedAt", dir: desc }]
    status: $status
    includeUnpublished: $includeUnpublished
  ) {
    ...BlogPostCard
  }
}

# `slug` has no unique constraint in zero-cms (the `slug` field kind validates its
# SHAPE, not its uniqueness), so this takes the first match and the route treats a
# second one as shadowed. See seed-blogs-schema.mjs.
query GetBlogPost(
  $slug: String!
  $status: CmsReadStatus = published
  $includeUnpublished: Boolean
) {
  blogPosts(
    filters: { slug: { eq: $slug } }
    pagination: { limit: 1 }
    status: $status
    includeUnpublished: $includeUnpublished
  ) {
    ...BlogPostCard
    # A plain String: the author's display name, captured when it was chosen
    # (ADR 0016). No nested selection, and no `meta` — a post's metadata is
    # derived from its title and excerpt rather than pointing at a `meta-data`
    # entry an editor had to pick.
    author
    sections {
      ...BlogPostSectionBlocks
    }
  }
}

# Route generation + the sitemap / cache-warm pass. Slugs only.
query GetBlogSlugs($status: CmsReadStatus = published, $includeUnpublished: Boolean) {
  blogPosts(status: $status, includeUnpublished: $includeUnpublished) {
    slug
  }
}
