#import "../../components/ui/project-card/project-card.graphql"
#import "../../components/ui/cta/cta.graphql"

# A Project's content is its `sections`, exactly like a page's. What used to be
# four owned child lists here (Deliverables, Timeline Steps, Project images,
# Client Comments) are section entries now — see ADR 0022 — so the only Project
# fields left are the ones the card and the header BOTH read, which is why they
# stay on the entry rather than moving into a hero section.
fragment ProjectDetail on Project {
  ...ProjectCard
  subCategory
  description
  featured
  clientRating
  occupancy
  sections {
    ...ProjectSectionBlocks
  }
  similarWork {
    ...ProjectCard
  }
  cta {
    ...Cta
  }
  sidebarCta {
    ...Cta
  }
}

query GetProject($id: ID!, $status: CmsReadStatus = published) {
  project(id: $id, status: $status) {
    ...ProjectDetail
  }
}

query GetProjectBySlug(
  $slug: String!
  $status: CmsReadStatus = published
  $includeUnpublished: Boolean
) {
  projects(
    filters: { slug: { eq: $slug } }
    pagination: { limit: 1 }
    status: $status
    includeUnpublished: $includeUnpublished
  ) {
    ...ProjectDetail
  }
}

# Both halves of every Project's address: the slug it should be served at, and
# the uuid that still has to redirect there. Used by `generateStaticParams`,
# the sitemap and the cache-warm pass alike.
query GetProjectIds($status: CmsReadStatus = published, $includeUnpublished: Boolean) {
  projects(pagination: { limit: 100 }, status: $status, includeUnpublished: $includeUnpublished) {
    id
    slug
  }
}
