query GetHomePage($status: CmsReadStatus = published, $includeUnpublished: Boolean) {
  pages(
    filters: { key: { eq: "home" } }
    pagination: { limit: 1 }
    status: $status
    includeUnpublished: $includeUnpublished
  ) {
    id
    type
    title
    description
    meta {
      ...PageMetadata
    }
    sections {
      ...PageSectionBlocks
    }
  }
}
